# MIND Graph Schema v1.8.1
# Source of truth for node types, link schema, and invariants

version: "1.8.1"
updated: "2025-12-28"
status: "CANONICAL"

# =============================================================================
# CORE PRINCIPLES
# =============================================================================
#
# 1. Single link type: `link` — all semantics in properties
# 2. Everything evolves: Traversals color links (emotions, permanence, polarity)
# 3. Emotions emerge: From relationships via alignment formula
# 4. Synthesis regenerates: From floats, re-embedded on drift
# 5. No arbitrary constants: All rates derived from graph properties
# 6. Bidirectional vocabulary: Same grammar for input and output

# =============================================================================
# NODE TYPES
# =============================================================================

nodes:
  actor:
    role: "Pump"
    behavior: "Injects energy via moments, spawns root subentity for queries"
    subtypes: [player, npc, system]

  moment:
    role: "Router + Branch Point"
    behavior: "Receives intention, can spawn subentities, only node type where branching occurs"
    subtypes: [event, decision, action]
    fields:
      status:
        type: enum
        values: [possible, active, completed]
        default: possible
      tick_created:
        type: int
        default: 0
      tick_resolved:
        type: int
        nullable: true

  narrative:
    role: "Attractor"
    behavior: "Destination of exploration, source of reflection, created by crystallization"
    subtypes: [issue, objective, task, belief, pattern, documentation]

  space:
    role: "Context container"
    behavior: "Bidirectional flow with contents"
    subtypes: [area, module, directory]

  thing:
    role: "Fast passthrough"
    behavior: "Receives briefly, tends toward 0"
    subtypes: [file, uri, artifact]
    fields:
      uri:
        type: string
        nullable: true

# =============================================================================
# NODE SCHEMA
# =============================================================================

NodeBase:
  fields:
    # Identity
    id:
      type: string
      required: true
    name:
      type: string
      required: true
    node_type:
      type: enum
      values: [actor, moment, narrative, space, thing]
      required: true
    type:
      type: string
      nullable: true
      description: "Subtype within node_type"

    # Physics
    weight:
      type: float
      range: [0, infinity]
      default: 1.0
    energy:
      type: float
      range: [0, infinity]
      default: 0.0

    # Semantics
    synthesis:
      type: string
      required: true
      description: "Natural language summary for embedding"
    embedding:
      type: vector
      dimensions: 1536
      description: "embed(synthesis), updated on drift"
    content:
      type: string
      default: ""
      description: "Full prose/description"

    # Temporal (auto-managed)
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# MOMENT BASE (extends NodeBase)
# =============================================================================

MomentBase:
  extends: NodeBase
  fields:
    started_at_s:
      type: int
      nullable: true
      auto: true
      description: "When moment became active"
    completed_at_s:
      type: int
      nullable: true
      auto: true
      description: "When moment was resolved"
    duration_s:
      type: int
      nullable: true
      computed: true
      description: "completed_at_s - started_at_s"

# =============================================================================
# LINK SCHEMA
# =============================================================================

links:
  link:
    description: "Universal link — all relationships"
    valid_from: [actor, space, thing, narrative, moment]
    valid_to: [actor, space, thing, narrative, moment]
    energy_carrier: true

LinkBase:
  fields:
    # Identity
    id:
      type: string
      required: true
    node_a:
      type: string
      required: true
    node_b:
      type: string
      required: true

    # Physics
    weight:
      type: float
      range: [0, infinity]
      default: 1.0
      description: "Importance + accumulated depth"
    energy:
      type: float
      range: [0, infinity]
      default: 0.0
      description: "Current activation"

    # Semantic Axes
    polarity:
      type: array
      items: float
      length: 2
      range: each [0, 1]
      default: [0.5, 0.5]
      description: "[a->b, b->a] flow strength"
    hierarchy:
      type: float
      range: [-1, +1]
      default: 0.0
      description: "-1 = contains, +1 = elaborates"
    permanence:
      type: float
      range: [0, 1]
      default: 0.5
      description: "0 = speculative, 1 = definitive"

    # Emotions (Plutchik 4 bipolar axes)
    joy_sadness:
      type: float
      range: [-1, +1]
      default: 0.0
    trust_disgust:
      type: float
      range: [-1, +1]
      default: 0.0
    fear_anger:
      type: float
      range: [-1, +1]
      default: 0.0
    surprise_anticipation:
      type: float
      range: [-1, +1]
      default: 0.0

    # Semantics
    synthesis:
      type: string
      description: "Human-readable, regenerated on drift"
    embedding:
      type: vector
      dimensions: 1536
      description: "Source of truth, accumulates intentions"

    # Temporal (auto-managed)
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# INVARIANTS
# =============================================================================

invariants:
  - "Single link type: link"
  - "All floats in specified ranges"
  - "Emotions emerge from alignment formula"
  - "No arbitrary constants - all rates derived"
  - "Branching only on Moments"
  - "Crystallization creates new Narratives"
  - "Forward coloration weight = (1 - permanence)"
  - "Vocabulary is bidirectional"

# =============================================================================
# DERIVED VALUES (for reference)
# =============================================================================

derived:
  forward_coloration_weight: "1 - link.permanence"
  blend_weight: "flow_energy / (flow_energy + link.energy + 1)"
  polarity_blend_weight: "w * (1 - link.permanence)"
  energy_accumulation: "flow_energy * (1 - link.permanence)"
  weight_solidification: "flow_energy * link.permanence"
  drift_threshold: "1 - link.permanence"
  criticality: "(1 - satisfaction) * (depth / (depth + 1))"
