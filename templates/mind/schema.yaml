# MIND Graph Schema v1.9.1
# Source of truth for node types, link schema, and invariants

version: "1.9.1"
updated: "2026-03-12"
status: "CANONICAL"

# =============================================================================
# CORE PRINCIPLES
# =============================================================================
#
# 1. Single link type: `link` — all semantics in properties
# 2. Everything evolves: Traversals color links (permanence, polarity)
# 3. Synthesis regenerates: From floats, re-embedded on drift
# 4. No arbitrary constants: All rates derived from graph properties
# 5. Bidirectional vocabulary: Same grammar for input and output

# =============================================================================
# NODE TYPES
# =============================================================================

nodes:
  actor:
    role: "Pump"
    behavior: "Injects energy via moments, spawns root subentity for queries"

  moment:
    role: "Router + Branch Point"
    behavior: "Receives intention, can spawn subentities, only node type where branching occurs"
    fields:
      status:
        type: enum
        values: [possible, active, completed]
        default: possible
      tick_created:
        type: int
        default: 0
      tick_resolved:
        type: int
        nullable: true

  narrative:
    role: "Attractor"
    behavior: "Destination of exploration, source of reflection, created by crystallization"

  space:
    role: "Context container"
    behavior: "Bidirectional flow with contents"

  thing:
    role: "Fast passthrough"
    behavior: "Receives briefly, tends toward 0"
    fields:
      uri:
        type: string
        nullable: true

# =============================================================================
# NODE SCHEMA
# =============================================================================

NodeBase:
  fields:
    # === Identity ===
    id:
      type: string
      required: true
    name:
      type: string
      required: true
    node_type:
      type: enum
      values: [actor, moment, narrative, space, thing]
      required: true
    type: # Free-form subtype
      type: string
      nullable: true

    # === Physics ===
    weight:
      type: float
      range: [0, infinity]
      default: 1.0
    energy:
      type: float
      range: [0, infinity]
      default: 0.0

    # === Text Data ===
    synthesis: # Natural language summary for embedding
      type: string
      required: true
    content: # Full prose text, code, or log output
      type: string
      nullable: true

    # === Embedding ===
    embedding: # embed(synthesis), updated on drift
      type: vector
      dimensions: 1536

    # === Metadata ===
    granularity: # Content granularity: 1=full doc, 2=per-section, 3=per-item
      type: int
      nullable: true
      values: [1, 2, 3]

    # === Temporal (auto-managed) ===
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# MOMENT BASE (extends NodeBase)
# =============================================================================

MomentBase:
  extends: NodeBase
  fields:
    started_at_s: # When moment became active
      type: int
      nullable: true
      auto: true
    completed_at_s: # When moment was resolved
      type: int
      nullable: true
      auto: true
    duration_s: # completed_at_s - started_at_s
      type: int
      nullable: true
      computed: true

# =============================================================================
# LINK SCHEMA
# =============================================================================

links:
  link: # Universal link — all relationships
    valid_from: [actor, space, thing, narrative, moment]
    valid_to: [actor, space, thing, narrative, moment]
    energy_carrier: true

LinkBase:
  fields:
    # === Identity ===
    id:
      type: string
      required: true
    node_a:
      type: string
      required: true
    node_b:
      type: string
      required: true

    # === Physics ===
    weight: # Importance + accumulated depth
      type: float
      range: [0, infinity]
      default: 1.0
    energy: # Current activation
      type: float
      range: [0, infinity]
      default: 0.0

    # === Semantic Axes ===
    polarity: # [a->b, b->a] flow strength
      type: array
      items: float
      length: 2
      range: each [0, 1]
      default: [0.5, 0.5]
    hierarchy: # -1 = contains, +1 = elaborates
      type: float
      range: [-1, +1]
      default: 0.0
    permanence: # 0 = speculative, 1 = definitive
      type: float
      range: [0, 1]
      default: 0.5

    # === Text Data ===
    synthesis: # Human-readable, regenerated on drift
      type: string
    embedding: # Source of truth, accumulates intentions
      type: vector
      dimensions: 1536

    # === Temporal (auto-managed) ===
    created_at_s:
      type: int
      required: true
      auto: true
    updated_at_s:
      type: int
      required: true
      auto: true
    last_traversed_at_s:
      type: int
      nullable: true
      auto: true

# =============================================================================
# INVARIANTS
# =============================================================================

invariants:
  - "Single link type: link"
  - "All floats in specified ranges"
  - "No arbitrary constants - all rates derived"
  - "Branching only on Moments"
  - "Crystallization creates new Narratives"
  - "Forward coloration weight = (1 - permanence)"
  - "Vocabulary is bidirectional"

# =============================================================================
# DERIVED VALUES (for reference)
# =============================================================================

derived:
  forward_coloration_weight: "1 - link.permanence"
  blend_weight: "flow_energy / (flow_energy + link.energy + 1)"
  polarity_blend_weight: "w * (1 - link.permanence)"
  energy_accumulation: "flow_energy * (1 - link.permanence)"
  weight_solidification: "flow_energy * link.permanence"
  drift_threshold: "1 - link.permanence"
  criticality: "(1 - satisfaction) * (depth / (depth + 1))"
