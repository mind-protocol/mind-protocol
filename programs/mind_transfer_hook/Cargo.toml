[package]
name = "mind_transfer_hook"
version = "0.1.0"
description = "TransferHook program for $MIND token - custom logic on every transfer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mind_transfer_hook"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
spl-transfer-hook-interface = "0.6"
spl-tlv-account-resolution = "0.6"
spl-type-length-value = "0.4"
